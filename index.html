<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Helper - Lost & Found Portal</title>
    <!-- Tailwind CSS CDN for instant responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🎓 Campus Helper</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full">Hackathon MVP Edition</span>
        </div>
    </nav>

    <div class="container mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Form Section: Add Item -->
        <div class="bg-white p-6 rounded-lg shadow-md h-fit">
            <h2 class="text-xl font-bold mb-4 text-blue-600">➕ Report Lost or Found Item</h2>
            <form id="itemForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Status</label>
                    <select id="type" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Lost">🚨 Lost Item</option>
                        <option value="Found">🟢 Found Item</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Item Title</label>
                    <input type="text" id="title" placeholder="e.g. Blue Water Bottle, Calculator" required class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Category</label>
                    <select id="category" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books/Stationery</option>
                        <option value="Personal Belongings">Personal Belongings</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Location / Details</label>
                    <textarea id="description" placeholder="Where was it seen/lost? Contact details..." required class="w-full border p-2 rounded h-20 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold transition">
                    Post Item
                </button>
            </form>
        </div>

        <!-- Dashboard Section: Search & List -->
        <div class="md:col-span-2 space-y-4">
            
            <!-- Search & Filter Controls -->
            <div class="bg-white p-4 rounded-lg shadow-md flex flex-col md:flex-row gap-4 justify-between items-center">
                <input type="text" id="searchInput" placeholder="🔍 Search items..." class="w-full md:w-2/3 border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500">
                <select id="filterCategory" class="w-full md:w-1/3 border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="All">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Books">Books/Stationery</option>
                    <option value="Personal Belongings">Personal Belongings</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <!-- Item Cards Grid -->
            <div id="itemsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Dynamic Items will be rendered here via JS -->
            </div>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
